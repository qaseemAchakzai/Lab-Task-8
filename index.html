<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form class="registration-form" action="#" method="post" enctype="multipart/form-data">
        <h1>Student Registration Form</h1>

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <label for="fathername">Father's Name</label>
        <input type="text" id="fathername" name="fathername" placeholder="Enter your father's name" required>

        <label for="regno">Registration Number</label>
        <input type="text" id="regno" name="regno" placeholder="e.g. 2026-BSSE-001" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6" required>

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" minlength="6" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>

        <label>Gender</label>
        <div class="radio-group">
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male" class="inline-label">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female" class="inline-label">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other" class="inline-label">Other</label>
        </div>

        <label for="department">Department</label>
        <select id="department" name="department" required>
            <option value="">Select department</option>
            <option value="BSSE">BSSE</option>
            <option value="BSAI">BSAI</option>
            <option value="BSDS">BSDS</option>
            <option value="BSCS">BSCS</option>
        </select>

        <label for="semester">Semester</label>
        <select id="semester" name="semester" required>
            <option value="">Select semester</option>
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
            <option value="5">5th</option>
            <option value="6">6th</option>
            <option value="7">7th</option>
            <option value="8">8th</option>
        </select>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 03001234567" pattern="[0-9]{11}" title="Enter an 11-digit phone number" required>

        <label for="address">Permanent Address</label>
        <textarea id="address" name="address" rows="3" placeholder="Enter your permanent address" required></textarea>

        <label for="photo">Profile Picture</label>
        <input type="file" id="photo" name="photo" accept="image/*">

        <div class="terms">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms" class="inline-label">I agree to the Terms and Conditions</label>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-register">Register</button>
            <button type="reset" class="btn-reset">Reset</button>
        </div>
    </form>

</body>
</html>
